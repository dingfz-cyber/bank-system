server:
  port: 8080

spring:
  application:
    name: bank-system
  datasource:
    url: jdbc:mysql://localhost:3306/bank_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: 你的数据库用户名
    password: 你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath:mapper/**/*.xml

bank:
  cors:
    allowed-origins: http://localhost:5173

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key}
  expiration: 86400000

logging:
  level:
    com.bank: debug
  file:
    name: logs/bank-system.log
